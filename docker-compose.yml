services:
  redis:
    image: redis:7-alpine
    container_name: auth_refresh_tokens_redis_container
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: auth_db_container
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    build:
      context: .
      args:
        - ENV_STATE=${ENV_STATE}
    container_name: auth_migrations_container
    environment:
      - ENV_STATE=${ENV_STATE}
      - DATABASE_URL=${DATABASE_URL}
      - ARGON2_MEMORY_COST=${ARGON2_MEMORY_COST}
      - ARGON2_TIME_COST=${ARGON2_TIME_COST}
      - ARGON2_PARALLELISM=${ARGON2_PARALLELISM}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: /docker-entrypoint.sh
    command: ["migrate"]

  fastapi-app:
    build:
      context: .
      args:
        - ENV_STATE=${ENV_STATE}
    container_name: auth_service_container
    ports:
      - "8000:8000"
    volumes:
      - auth_service_logs:/AuthService/logs
    environment:
      - ENV_STATE=${ENV_STATE}
      - DEBUG=${DEBUG}
      - DATABASE_URL=${DATABASE_URL}
      - POOL_SIZE=${POOL_SIZE}
      - MAX_OVERFLOW=${MAX_OVERFLOW}
      - POOL_TIMEOUT=${POOL_TIMEOUT}
      - POOL_RECYCLE=${POOL_RECYCLE}
      - POOL_PRE_PING=${POOL_PRE_PING}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_JSON_FORMAT=${LOG_JSON_FORMAT}
      - LOG_MAX_BYTES=${LOG_MAX_BYTES}
      - LOG_BACKUP_COUNT=${LOG_BACKUP_COUNT}
      - LOG_DIR=${LOG_DIR}
      - ARGON2_MEMORY_COST=${ARGON2_MEMORY_COST}
      - ARGON2_TIME_COST=${ARGON2_TIME_COST}
      - ARGON2_PARALLELISM=${ARGON2_PARALLELISM}
    depends_on:
      migrations:
        condition: service_completed_successfully
    entrypoint: /docker-entrypoint.sh
    command: []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test_runner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - TEST_TYPE=${TEST_TYPE:-all}
      - RUN_TESTS=true
      - DOCKER_HOST=unix:///var/run/docker.sock
      - PYTHONPATH=/AuthService:/AuthService/app
    depends_on:
      redis:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    entrypoint: /bin/sh
    command: >
      -c "
        cd /AuthService &&
        echo 'Waiting for Redis...' &&
        while ! nc -z redis 6379; do sleep 1; done &&
        echo 'Redis is ready!' &&
        echo 'Running tests...' &&
        if [ \"$TEST_TYPE\" = 'unit' ]; then
          uv run pytest tests/unit/ -v --tb=short
        elif [ \"$TEST_TYPE\" = 'integration' ]; then
          uv run pytest tests/integration/ -v --tb=short
        elif [ \"$TEST_TYPE\" = 'component' ]; then
          uv run pytest tests/component/ -v --tb=short
        elif [ \"$TEST_TYPE\" = 'end2end' ]; then
          uv run pytest tests/end-to-end/ -v --tb=short
        else
          uv run pytest tests/ -v --tb=short
        fi
      "
    profiles:
      - tests

volumes:
  postgres_data2:
  redis_data:
  auth_service_logs: